<!-- Планета на главном экране, ОТКЛЮЧЕНО (покой). Поле 220×220 = размер на Android (220 dp). r = 0.42·220 = 92.4.
     Статичный кадр planet.js при state='off'. Живую планету рисует planet.js. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <circle cx="110" cy="110" r="92.4" fill="#000000"/>
  <g fill="none" stroke="#272D3A" stroke-width="2.033">
    <ellipse cx="110" cy="110" rx="27.02" ry="92.4"/>
    <ellipse cx="110" cy="110" rx="63.01" ry="92.4"/>
    <ellipse cx="110" cy="110" rx="90.03" ry="92.4"/>
  </g>
  <circle cx="110" cy="110" r="92.4" fill="none" stroke="#3A4358" stroke-width="4.158"/>
  <circle cx="110" cy="17.6" r="6.93" fill="#3A4358"/>
  <circle cx="110" cy="202.4" r="6.93" fill="#3A4358"/>
</svg>
